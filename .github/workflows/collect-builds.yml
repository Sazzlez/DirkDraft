# Collects games from the Riot API and publishes what was counted:
#   builds.json - builds per champion and lane (Platinum, Solo/Duo)
#   meta.json   - the draft model's numbers: lane rates, duels, duos, bans, damage types (same games)
#   situational.json - boots and items four to six per enemy situation (AD/AP-heavy, tanks, CC)
#   aram.json   - plain ARAM: win rate per champion for the bench, builds. It stands in for ARAM
#                 Mayhem, whose games Riot's API does not hand out (403, measured 07.11.2026).
#
# One key for everybody: the Riot key lives only in the repository secret RIOT_API_KEY, never in
# the code or the app. Each run collects for about five and a half hours (the hosted runner allows
# six), keeps its progress in the Actions cache - not public - and publishes the files as the only
# files of the branch "data", from where every DirkDraft downloads them. They hold counts per
# champion, lane and rank; no player names, PUUIDs or match ids. The ARAM count draws its first
# players from the Platinum league lists and follows the players of each counted game; that list
# stays in memory for the run.
name: Daten sammeln

on:
  schedule:
    # Every six hours; a run takes five and a half, so the key is busy most of the day. Only the
    # fallback now: GitHub skipped the 06:23 and 12:23 slots of 07.11.2026 without a trace, so each
    # run starts its successor itself (last step). The concurrency group below keeps it at one
    # collector at a time — the key's rate stays what one run uses, only the gap between runs goes.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Sammelzeit Ranked in Minuten'
        default: '270'
      aram_minutes:
        description: 'Sammelzeit ARAM in Minuten'
        default: '60'

# Never two collectors on one state: the second would count the same games again.
concurrency:
  group: collect-builds
  cancel-in-progress: false

permissions:
  contents: write
  # The last step starts the next run (workflow_dispatch) and looks whether one is already waiting.
  actions: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      STATE: riot-state.json.gz
      ARAM_STATE: aram-state.json.gz
      TIERS: platinum

    steps:
      - name: Schluessel vorhanden?
        id: key
        run: |
          echo "STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          if [ -z "$RIOT_API_KEY" ]; then
            echo "::notice::Kein RIOT_API_KEY hinterlegt - nichts zu tun."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-dotnet@v4
        if: steps.key.outputs.present == 'true'
        with:
          dotnet-version: '10.0.x'

      # The newest state of an earlier run; a fresh start on the very first run or a new patch.
      - name: Stand laden
        if: steps.key.outputs.present == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.STATE }}
            ${{ env.ARAM_STATE }}
          key: riot-state-${{ github.run_id }}
          restore-keys: riot-state-

      - name: Ranked sammeln
        if: steps.key.outputs.present == 'true'
        run: >
          dotnet run --project src/DraftPilot.Tools -c Release --
          riot collect --minutes "${{ inputs.minutes || '270' }}" --tiers "$TIERS" --state "$STATE"

      - name: ARAM sammeln
        if: always() && steps.key.outputs.present == 'true'
        run: >
          dotnet run --project src/DraftPilot.Tools -c Release --
          riot aram --minutes "${{ inputs.aram_minutes || '60' }}" --tiers "$TIERS" --state "$ARAM_STATE"

      # Also after a failed collect: the states are saved every hundred (fifty) games, and what was
      # counted before the failure is still counted.
      - name: Stand sichern
        if: always() && steps.key.outputs.present == 'true' && hashFiles(env.STATE, env.ARAM_STATE) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.STATE }}
            ${{ env.ARAM_STATE }}
          key: riot-state-${{ github.run_id }}

      - name: Exportieren
        if: steps.key.outputs.present == 'true'
        run: |
          dotnet run --project src/DraftPilot.Tools -c Release --no-build -- riot export --state "$STATE" --tier "$TIERS" --out publish/builds.json --meta-out publish/meta.json --situational-out publish/situational.json --games-out private/games.json.gz --matchups-out private/matchups.json.gz
          dotnet run --project src/DraftPilot.Tools -c Release --no-build -- riot export-aram --state "$ARAM_STATE" --out publish/aram.json

      # The counted games themselves (ten champions and a result each, no players, no match ids) and
      # the matchup builds, for measuring the draft model (docs/draft-konzept.md). Not published: an
      # artifact of the run, kept a week; each run's files hold everything counted so far.
      - name: Spiel-Liste sichern
        if: steps.key.outputs.present == 'true' && hashFiles('private/games.json.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: games
          path: private/
          retention-days: 7
          compression-level: 0

      # What is published now: the new files are held against it, and what is not replaced stays.
      - name: Veroeffentlichten Stand holen
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p published publish
          if git fetch -q --depth 1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C published
          else
            echo "::notice::Noch kein Branch data - erste Veroeffentlichung."
          fi

      # One commit, force-pushed: the branch holds the current files and no history of old ones.
      # Before that, the guard (riot guard, PublishGuard.cs): the state lives in the Actions cache, and
      # when that is gone once the next run starts at zero - its export must not put a few thousand
      # games where 270.000 stood. On the same patch a count below half of the published one is not
      # published; the published files stay, and the run says so as an error with both numbers. Any
      # exit code but 0 keeps what is published - also when the tool itself does not run.
      - name: Veroeffentlichen
        if: steps.key.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tool() { dotnet run --project src/DraftPilot.Tools -c Release --no-build -- "$@"; }
          keep() {
            for f in "$@"; do
              if [ -f "published/$f" ]; then cp "published/$f" "publish/$f"; else rm -f "publish/$f"; fi
            done
          }
          changed=0

          # Ranked: three files of one count, published together or not at all.
          if tool riot guard --label Ranked --old published/meta.json --new publish/meta.json \
              && [ -f publish/builds.json ] && [ -f publish/situational.json ]; then
            changed=1
          else
            keep meta.json builds.json situational.json
          fi

          if tool riot guard --label ARAM --old published/aram.json --new publish/aram.json; then
            changed=1
          else
            keep aram.json
          fi

          # Whatever else is published and was not written anew stays on the branch.
          for path in published/*; do
            [ -f "$path" ] || continue
            f=$(basename "$path")
            [ -f "publish/$f" ] || cp "$path" "publish/$f"
          done

          if [ "$changed" -eq 0 ]; then
            echo "::notice::Nichts Neues zu veroeffentlichen - der veroeffentlichte Stand bleibt."
            exit 0
          fi

          cd publish
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -q -m "Daten $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      # The next run, started by this one (a workflow_dispatch from GITHUB_TOKEN does start a run).
      # Guards: a run that ended within 30 minutes failed early — no chain then, or a broken key would
      # loop every few minutes; the six-hourly schedule stays as the fallback. Nothing is started while
      # another run already waits (the schedule's). The repository variable COLLECT_CHAIN=off stops the
      # chain without touching this file.
      - name: Naechsten Lauf starten
        if: always() && steps.key.outputs.present == 'true' && vars.COLLECT_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          elapsed=$(( $(date +%s) - STARTED_AT ))
          if [ "$elapsed" -lt 1800 ]; then
            echo "::notice::Lauf endete nach $(( elapsed / 60 )) min - kein Nachfolger, der Zeitplan bleibt."
            exit 0
          fi
          waiting=0
          for status in queued pending waiting requested; do
            n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow collect-builds.yml --status "$status" --json databaseId --jq length)
            waiting=$(( waiting + n ))
          done
          if [ "$waiting" -gt 0 ]; then
            echo "::notice::Es wartet schon ein Lauf - kein weiterer."
            exit 0
          fi
          gh workflow run collect-builds.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
          echo "::notice::Naechster Lauf gestartet."
