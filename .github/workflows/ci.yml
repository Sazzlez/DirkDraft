# Checks every push and pull request: the app's TypeScript (tests and type check), the Rust shell,
# and the C# collector and tools. Until November 2026 only app/scripts/release.ps1 tested anything,
# locally and only Vitest and cargo test - a C# compile error on master stopped the data collection
# without a trace, because every collector run builds from master.
name: CI

on:
  push:
    # "data" holds only the published files, force-pushed by the collector.
    branches-ignore: [data]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: App (Vitest, svelte-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run check

  shell:
    name: Shell (cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: app/package-lock.json
      # tauri.conf.json embeds frontendDist ../dist: the crate does not compile without the page.
      - name: Frontend bauen
        working-directory: app
        run: |
          npm ci
          npm run build
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: cargo test
        working-directory: app/src-tauri
        run: cargo test

  collector:
    name: Sammler (dotnet build, dotnet test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build DraftPilot.sln -c Release
      - run: dotnet test DraftPilot.sln -c Release --no-build

  # The workflow files themselves. collect-builds.yml runs on a schedule only: a mistake in it shows
  # nowhere on a push and would stop the collection the next time it is due.
  workflows:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

  # One picture per moment, width and theme, to look at a layout change without opening the app.
  # The portraits come from Data Dragon over the network, so a failure here never fails the run.
  shots:
    name: Bilder (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: app/screenshots/
          retention-days: 7
          if-no-files-found: ignore
