[package]
name = "dirkdraft"
version = "2.0.0-dev"
description = "DirkDraft 2.0 — Draft- und Spielhilfe für League of Legends"
edition = "2021"
publish = false

# Velopack packs and updates "DirkDraft.exe" (same name as 1.x, see docs/redesign/migration.md).
[[bin]]
name = "DirkDraft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velopack = "0.0"
# The League client and the game: TLS pinned to Riot's authority (ring, no system roots), HTTP,
# the WAMP event socket.
tokio = { version = "1", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
x509-parser = { version = "0.18", features = ["verify"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
# ShowWindow(SW_SHOWNOACTIVATE): bring the window up without taking the focus from the game.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
