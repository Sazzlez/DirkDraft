<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- DirkDraft 2.0 app icon: the title-bar mark at full size. Teal-to-blue on a rounded square,
       a white "D" drawn as one stroke, a soft top light — the master for every icon size. -->
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0.04" x2="0.88" y2="0.98">
      <stop offset="0" stop-color="#2fd6c5" />
      <stop offset="0.62" stop-color="#0a84ff" />
      <stop offset="1" stop-color="#0659d6" />
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#002a6b" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)" />
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#light)" />
  <rect x="66" y="66" width="892" height="892" rx="206" fill="none" stroke="url(#edge)" stroke-width="4" />
  <path
    d="M 362 286 H 534 A 226 226 0 0 1 534 738 H 362 Z"
    fill="none"
    stroke="#ffffff"
    stroke-width="92"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />
</svg>
